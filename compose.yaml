services:
  web:
    image: flask-ra:${IMAGE_TAG:-local}
    build: .
    container_name: ra-flask
    ports:
      - "127.0.0.1:5050:5000"
    environment:
      APP_VERSION: ${IMAGE_TAG:-local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
